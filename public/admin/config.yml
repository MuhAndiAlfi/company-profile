# Login via Netlify Identity (git-gateway). Ganti sesuai hosting kalau perlu.
backend:
  name: git-gateway
  branch: main

# Saat `npm run cms` jalan, CMS langsung menulis ke file lokal tanpa login
local_backend: true

locale: en
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Konten Website
    editor: { preview: false }
    files:
      - name: home
        label: Halaman Utama
        file: src/data/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Label kecil, name: badge, widget: string }
              - { label: Judul, name: title, widget: string }
              - { label: Deskripsi, name: description, widget: text }
              - { label: Gambar, name: image, widget: image, required: false }
              - label: Poin unggulan
                name: highlights
                widget: list
                fields: [{ label: Teks, name: text, widget: string }]

          - label: Layanan
            name: services
            widget: object
            fields:
              - { label: Judul, name: title, widget: string }
              - { label: Subjudul, name: subtitle, widget: text }
              - label: Daftar layanan
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - label: Ikon
                    name: icon
                    widget: select
                    options: [cube, printer, laser, tag, star, check]
                    default: cube
                  - { label: Judul, name: title, widget: string }
                  - { label: Deskripsi, name: description, widget: text }

          - label: Partner / Klien
            name: clients
            widget: object
            fields:
              - { label: Judul, name: title, widget: string }
              - label: Daftar klien
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Nama, name: name, widget: string }
                  - { label: Logo, name: logo, widget: image, required: false }

          - label: Section gambar & teks (Kenapa Kami, Portofolio, Teknologi, dst.)
            name: features
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Label kecil, name: label, widget: string }
              - { label: Judul, name: title, widget: string }
              - { label: Deskripsi, name: description, widget: text }
              - { label: Gambar, name: image, widget: image, required: false }
              - { label: Teks tombol (opsional), name: buttonText, widget: string, required: false }
              - { label: Link tombol (opsional), name: buttonUrl, widget: string, required: false }

          - label: Showcase Karya
            name: showcase
            widget: object
            fields:
              - { label: Judul, name: title, widget: string }
              - { label: Subjudul, name: subtitle, widget: string }
              - label: Daftar karya
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Gambar, name: image, widget: image, required: false }
                  - { label: Kategori, name: category, widget: string }
                  - { label: Judul, name: title, widget: string }
                  - { label: Subjudul, name: subtitle, widget: string }

          - label: Testimoni
            name: testimonials
            widget: object
            fields:
              - { label: Judul, name: title, widget: string }
              - label: Daftar testimoni
                name: items
                widget: list
                summary: "{{fields.name}} — {{fields.text}}"
                fields:
                  - { label: Nama, name: name, widget: string }
                  - { label: Tanggal, name: date, widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
                  - { label: Rating, name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
                  - { label: Ulasan, name: text, widget: text }

          - label: FAQ (Tanya Jawab) — penting untuk SEO & AI
            name: faq
            widget: object
            fields:
              - { label: Judul, name: title, widget: string }
              - label: Daftar pertanyaan
                name: items
                widget: list
                summary: "{{fields.question}}"
                hint: "Tulis pertanyaan seperti cara orang bertanya ke Google/ChatGPT. Jawaban singkat, jelas, sebut nama kota."
                fields:
                  - { label: Pertanyaan, name: question, widget: string }
                  - { label: Jawaban, name: answer, widget: text }

      - name: settings
        label: Pengaturan & Kontak
        file: src/data/settings.json
        fields:
          - { label: "URL website (contoh: https://namastudio.id)", name: siteUrl, widget: string }
          - { label: Nama brand, name: brandName, widget: string }
          - { label: Tagline, name: brandTagline, widget: string }
          - { label: Logo, name: logo, widget: image, required: false }

          - { label: "Judul SEO (tampil di Google, ±60 karakter, sebut layanan + kota)", name: seoTitle, widget: string }
          - { label: "Deskripsi SEO (tampil di Google, ±155 karakter)", name: seoDescription, widget: text }
          - { label: "Gambar share (1200×630, tampil saat link dibagikan di WA/medsos)", name: ogImage, widget: image, required: false }
          - { label: "Tentang bisnis (1–2 kalimat faktual: siapa, apa, di mana) — dipakai footer & AI", name: description, widget: text }
          - { label: Tahun berdiri, name: foundingYear, widget: string, required: false }

          - { label: "Nomor WhatsApp (format 628xxx)", name: whatsapp, widget: string }
          - { label: Pesan awal WhatsApp, name: waMessage, widget: string }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Username Instagram, name: instagramHandle, widget: string }
          - { label: Link Instagram, name: instagramUrl, widget: string }
          - { label: Nama marketplace, name: marketplaceLabel, widget: string }
          - { label: Link marketplace, name: marketplaceUrl, widget: string }
          - { label: Link Google Maps / Google Business Profile, name: googleMapsUrl, widget: string, required: false }
          - { label: PDF Katalog, name: catalogPdf, widget: file, required: false }

          - { label: Alamat jalan, name: streetAddress, widget: string }
          - { label: Kota, name: city, widget: string }
          - { label: Provinsi, name: province, widget: string }
          - { label: Kode pos, name: postalCode, widget: string }
          - { label: "Latitude (opsional, dari Google Maps)", name: latitude, widget: string, required: false }
          - { label: "Longitude (opsional, dari Google Maps)", name: longitude, widget: string, required: false }
          - label: Area layanan
            name: areaServed
            widget: list
            summary: "{{fields.name}}"
            fields: [{ label: Nama area, name: name, widget: string }]

          - label: Jam operasional
            name: hours
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Label (contoh: Senin – Sabtu)", name: label, widget: string }
              - label: Hari
                name: days
                widget: select
                multiple: true
                options:
                  - { label: Senin, value: Monday }
                  - { label: Selasa, value: Tuesday }
                  - { label: Rabu, value: Wednesday }
                  - { label: Kamis, value: Thursday }
                  - { label: Jumat, value: Friday }
                  - { label: Sabtu, value: Saturday }
                  - { label: Minggu, value: Sunday }
              - { label: Tutup, name: closed, widget: boolean, default: false }
              - { label: "Jam buka (HH:MM)", name: opens, widget: string, required: false }
              - { label: "Jam tutup (HH:MM)", name: closes, widget: string, required: false }
