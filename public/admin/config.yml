# Konfigurasi CMS (Sveltia CMS)
# - Lokal  : buka /admin/ di Chrome/Edge → "Work with Local Repository" → pilih folder project ini.
# - Online : login pakai GitHub (Personal Access Token). Setiap simpan = commit ke repo → web build ulang otomatis.
backend:
  name: github
  repo: MuhAndiAlfi/company-profile
  branch: main
  commit_messages:
    update: "konten: ubah {{collection}} / {{slug}}"
    uploadMedia: "media: upload {{path}}"
    deleteMedia: "media: hapus {{path}}"

app_title: Admin Website
logo:
  src: ../favicon.svg

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: home
    label: Halaman Utama
    icon: home
    editor: { preview: false }
    files:
      - name: hero
        label: 1. Hero (bagian paling atas)
        file: src/data/home/hero.json
        fields:
          - { label: Label kecil di atas judul, name: badge, widget: string, maxlength: 60 }
          - { label: Judul utama, name: title, widget: string, maxlength: 70, hint: "Sebut layanan + kota, contoh: Jasa 3D Print di Bandung. Ini judul terpenting untuk Google & AI." }
          - { label: Deskripsi, name: description, widget: text, maxlength: 300 }
          - { label: Gambar, name: image, widget: image, required: false, hint: "Rasio 4:3, disarankan 1200×900 px, maks ±300 KB." }
          - label: Poin unggulan
            name: highlights
            widget: list
            max: 4
            summary: "{{fields.text}}"
            fields: [{ label: Teks, name: text, widget: string, maxlength: 30 }]

      - name: services
        label: 2. Layanan
        file: src/data/home/services.json
        fields:
          - { label: Judul section, name: title, widget: string }
          - { label: Subjudul, name: subtitle, widget: text }
          - label: Daftar layanan
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: Ikon
                name: icon
                widget: select
                default: cube
                options:
                  - { label: Kubus (3D print), value: cube }
                  - { label: Printer, value: printer }
                  - { label: Petir (laser), value: laser }
                  - { label: Label / tag, value: tag }
                  - { label: Bintang, value: star }
                  - { label: Centang, value: check }
              - { label: Nama layanan, name: title, widget: string, maxlength: 40 }
              - { label: Deskripsi, name: description, widget: text, maxlength: 180 }

      - name: clients
        label: 3. Partner / Klien
        file: src/data/home/clients.json
        fields:
          - { label: Judul section, name: title, widget: string }
          - label: Daftar klien
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Nama klien, name: name, widget: string }
              - { label: Logo, name: logo, widget: image, required: false, hint: "PNG/SVG latar transparan, tinggi ±120 px. Kalau kosong, nama klien yang tampil." }

      - name: features
        label: 4. Section Gambar & Teks
        file: src/data/home/features.json
        fields:
          - label: Daftar section
            name: items
            widget: list
            summary: "{{fields.title}}"
            hint: "Tampil bergantian kiri-kanan. Contoh: Kenapa Pilih Kami, Portofolio, Teknologi."
            fields:
              - { label: Label kecil, name: label, widget: string, maxlength: 40 }
              - { label: Judul, name: title, widget: string, maxlength: 80 }
              - { label: Deskripsi, name: description, widget: text, maxlength: 400 }
              - { label: Gambar, name: image, widget: image, required: false, hint: "Rasio 4:3, disarankan 1200×900 px." }
              - { label: Teks tombol (opsional), name: buttonText, widget: string, required: false }
              - { label: Link tombol (opsional), name: buttonUrl, widget: string, required: false, pattern: ["^https?://", "Harus diawali http:// atau https://"] }

      - name: showcase
        label: 5. Showcase Karya
        file: src/data/home/showcase.json
        fields:
          - { label: Judul section, name: title, widget: string }
          - { label: Subjudul, name: subtitle, widget: string }
          - label: Daftar karya
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Foto, name: image, widget: image, required: false, hint: "Persegi 1:1, disarankan 800×800 px." }
              - { label: Kategori, name: category, widget: string, maxlength: 25 }
              - { label: Judul, name: title, widget: string, maxlength: 60 }
              - { label: Keterangan, name: subtitle, widget: string, maxlength: 80 }

      - name: testimonials
        label: 6. Testimoni
        file: src/data/home/testimonials.json
        fields:
          - { label: Judul section, name: title, widget: string }
          - label: Daftar testimoni
            name: items
            widget: list
            summary: "{{fields.name}} — {{fields.text}}"
            fields:
              - { label: Nama pelanggan, name: name, widget: string }
              - { label: Tanggal, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
              - { label: Rating, name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { label: Ulasan, name: text, widget: text, maxlength: 250 }

      - name: faq
        label: 7. FAQ (penting untuk Google & AI)
        file: src/data/home/faq.json
        fields:
          - { label: Judul section, name: title, widget: string }
          - label: Daftar pertanyaan
            name: items
            widget: list
            summary: "{{fields.question}}"
            hint: "Tulis pertanyaan seperti orang bertanya ke Google/ChatGPT. Jawab singkat (1–3 kalimat), faktual, sebut nama kota."
            fields:
              - { label: Pertanyaan, name: question, widget: string, maxlength: 120 }
              - { label: Jawaban, name: answer, widget: text, maxlength: 500 }

  - name: settings
    label: Pengaturan
    icon: settings
    editor: { preview: false }
    files:
      - name: settings
        label: Identitas, SEO & Kontak
        file: src/data/settings.json
        fields:
          - { label: URL website final, name: siteUrl, widget: string, pattern: ["^https://[^/]+/?$", "Contoh: https://namastudio.id"] }
          - { label: Nama brand, name: brandName, widget: string, maxlength: 40 }
          - { label: Tagline, name: brandTagline, widget: string, maxlength: 50 }
          - { label: Logo, name: logo, widget: image, required: false, hint: "Persegi, PNG/SVG, minimal 256×256 px. Dipakai juga sebagai ikon tab browser." }

          - { label: Judul SEO (tampil di hasil Google), name: seoTitle, widget: string, minlength: 30, maxlength: 65, hint: "Layanan utama + kota + nama brand." }
          - { label: Deskripsi SEO (tampil di hasil Google), name: seoDescription, widget: text, minlength: 70, maxlength: 160 }
          - { label: Gambar share, name: ogImage, widget: image, required: false, hint: "1200×630 px. Tampil saat link dibagikan di WhatsApp/medsos." }
          - { label: Tentang bisnis, name: description, widget: text, maxlength: 350, hint: "1–2 kalimat faktual: siapa, layanan apa, di kota mana. Dipakai di footer, Google, dan AI." }
          - { label: Tahun berdiri, name: foundingYear, widget: string, required: false, pattern: ["^[0-9]{4}$", "4 digit tahun, contoh 2022"] }

          - { label: Nomor WhatsApp, name: whatsapp, widget: string, pattern: ["^62[0-9]{8,13}$", "Awali 62, tanpa + atau spasi. Contoh: 6281234567890"] }
          - { label: Pesan awal WhatsApp, name: waMessage, widget: string }
          - { label: Email, name: email, widget: string, required: false, pattern: ["^[^@ ]+@[^@ ]+[.][^@ ]+$", "Format email tidak valid"] }
          - { label: Username Instagram, name: instagramHandle, widget: string, pattern: ["^@", "Awali dengan @"] }
          - { label: Link Instagram, name: instagramUrl, widget: string, pattern: ["^https?://", "Harus diawali http:// atau https://"] }
          - { label: Nama marketplace, name: marketplaceLabel, widget: string }
          - { label: Link marketplace, name: marketplaceUrl, widget: string, pattern: ["^https?://", "Harus diawali http:// atau https://"] }
          - { label: Link Google Maps / Google Business Profile, name: googleMapsUrl, widget: string, required: false, pattern: ["^https?://", "Harus diawali http:// atau https://"] }
          - { label: PDF Katalog, name: catalogPdf, widget: file, required: false, hint: "Tombol Lihat Katalog membuka PDF ini. Kalau kosong, tombol menggulir ke Showcase Karya." }

          - { label: Alamat jalan, name: streetAddress, widget: string }
          - { label: Kota, name: city, widget: string }
          - { label: Provinsi, name: province, widget: string }
          - { label: Kode pos, name: postalCode, widget: string, pattern: ["^[0-9]{5}$", "5 digit angka"] }
          - { label: Latitude, name: latitude, widget: string, required: false, pattern: ["^-?[0-9]+[.][0-9]+$", "Contoh: -6.914744"], hint: "Klik kanan lokasi di Google Maps, angka pertama." }
          - { label: Longitude, name: longitude, widget: string, required: false, pattern: ["^-?[0-9]+[.][0-9]+$", "Contoh: 107.609810"], hint: "Angka kedua dari Google Maps." }
          - label: Area layanan
            name: areaServed
            widget: list
            summary: "{{fields.name}}"
            fields: [{ label: Nama area, name: name, widget: string }]

          - label: Jam operasional
            name: hours
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Label (contoh: Senin – Sabtu)", name: label, widget: string }
              - label: Hari
                name: days
                widget: select
                multiple: true
                options:
                  - { label: Senin, value: Monday }
                  - { label: Selasa, value: Tuesday }
                  - { label: Rabu, value: Wednesday }
                  - { label: Kamis, value: Thursday }
                  - { label: Jumat, value: Friday }
                  - { label: Sabtu, value: Saturday }
                  - { label: Minggu, value: Sunday }
              - { label: Tutup, name: closed, widget: boolean, default: false }
              - { label: Jam buka, name: opens, widget: string, required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Format jam HH:MM, contoh 09:00"] }
              - { label: Jam tutup, name: closes, widget: string, required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Format jam HH:MM, contoh 09:00"] }
